name: Sync web/ to GitHub Pages (gh-pages)

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push web/ to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          SPLIT_SHA=$(git subtree split --prefix=web main)
          git push -f origin "$SPLIT_SHA:refs/heads/gh-pages"
